"$schema" = 'https://starship.rs/config-schema.json'

# Bullet-train look (https://github.com/caiogondim/bullet-train.zsh):
# solid colour blocks joined by powerline arrows. Needs a Nerd/Powerline font.
# os(+user@host) -> directory -> git, then cmd duration and the prompt char.
format = """
${custom.host_neptune}${custom.host_saturn}${custom.host_pihole}${custom.host_homeassistant}${custom.host_steamdeck}${custom.host_forgejo}${custom.host_unifi}${custom.host_docker}${custom.host_opnsense}${custom.host_default}${custom.host_mac}${custom.host_win}$directory\
${custom.nogit}${custom.nogit_macos}${custom.nogit_win}($git_branch$git_status[](fg:green))\
$cmd_duration
$character"""

add_newline = true

[os]
disabled = true   # replaced by custom.hosticon (per-host icon), see below

# Per-host segment: icon + user@host (over SSH/root) on a host-specific
# background, followed by the closing triangle into the directory block.
# Add a host = add one [custom.host_*] block (colour + glyph + hostname match).
# Glyphs: Nerd Font (md-*, dev-proxmox). No Steam Deck glyph exists in Nerd
# Fonts, md-gamepad_square_outline is the closest. Foregrounds are picked for
# contrast against each background. Unlisted hosts fall back to black + OS glyph.
[custom.host_neptune]
os = "linux"
when = 'case "$(hostname -s)" in neptune) exit 0;; *) exit 1;; esac'
shell = ["sh"]
command = '''i=""; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:#000000 bg:#E57000)[](fg:#E57000 bg:blue)"

[custom.host_saturn]
os = "linux"
when = 'case "$(hostname -s)" in saturn) exit 0;; *) exit 1;; esac'
shell = ["sh"]
command = '''i="󰒋"; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:#000000 bg:#9CCBF2)[](fg:#9CCBF2 bg:blue)"

[custom.host_pihole]
os = "linux"
when = 'case "$(hostname -s)" in pihole) exit 0;; *) exit 1;; esac'
shell = ["sh"]
command = '''i="󰷱"; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:#FFFFFF bg:#C8102E)[](fg:#C8102E bg:blue)"

[custom.host_homeassistant]
os = "linux"
when = 'case "$(hostname -s)" in vm101*|homeassistant) exit 0;; *) exit 1;; esac'
shell = ["sh"]
command = '''i="󰟐"; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:#000000 bg:#18BCF2)[](fg:#18BCF2 bg:blue)"

[custom.host_steamdeck]
os = "linux"
when = 'case "$(hostname -s)" in steamdeck) exit 0;; *) exit 1;; esac'
shell = ["sh"]
command = '''i="󰺶"; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:#FFFFFF bg:#6C4AB6)[](fg:#6C4AB6 bg:blue)"

[custom.host_forgejo]
os = "linux"
when = 'case "$(hostname -s)" in forgejo) exit 0;; *) exit 1;; esac'
shell = ["sh"]
command = '''i="󰊢"; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:#000000 bg:#609926)[](fg:#609926 bg:blue)"

[custom.host_unifi]
os = "linux"
when = 'case "$(hostname -s)" in unifi) exit 0;; *) exit 1;; esac'
shell = ["sh"]
command = '''i="󰨹"; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:#FFFFFF bg:#0B5FD6)[](fg:#0B5FD6 bg:blue)"

[custom.host_docker]
os = "linux"
when = 'case "$(hostname -s)" in intranet|glance|minecraft) exit 0;; *) exit 1;; esac'
shell = ["sh"]
command = '''i="󰡨"; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:#000000 bg:#2496ED)[](fg:#2496ED bg:blue)"

[custom.host_opnsense]
os = "linux"
when = 'case "$(hostname -s)" in opnsense*) exit 0;; *) exit 1;; esac'
shell = ["sh"]
command = '''i="󰒘"; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:#FFFFFF bg:#C2410C)[](fg:#C2410C bg:blue)"

[custom.host_default]
os = "linux"
when = 'case "$(hostname -s)" in neptune|saturn|pihole|vm101*|homeassistant|steamdeck|forgejo|unifi|intranet|glance|minecraft|opnsense*) exit 1;; *) exit 0;; esac'
shell = ["sh"]
command = '''i=""; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:white bg:black)[](fg:black bg:blue)"

[custom.host_mac]
os = "macos"
when = true
shell = ["sh"]
command = '''i=""; printf '%s' "$i"; if [ -n "$SSH_CONNECTION" ] || [ "$(id -u)" = 0 ]; then printf '  %s@%s' "$(id -un)" "$(hostname -s)"; fi'''
format = "[ $output ](bold fg:white bg:black)[](fg:black bg:blue)"

[custom.host_win]
os = "windows"
when = true
shell = ["powershell", "-NoProfile", "-Command", "-"]
command = '''$e = " "; if ($env:SSH_CONNECTION) { $e = "  $env:USERNAME@$env:COMPUTERNAME" }; Write-Output $e'''
format = "[ $output ](bold fg:white bg:black)[](fg:black bg:blue)"

[username]
show_always = false
style_user = "fg:white bg:black"
style_root = "bold fg:red bg:black"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold fg:yellow bg:black"
format = "[@$hostname ]($style)"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold fg:white bg:blue"
read_only_style = "fg:red bg:blue"
format = "[ $path ]($style)[$read_only]($read_only_style)"

# Closing arrow for the directory block when NOT in a git repo (inside a repo
# the git block supplies it). Starship has no "inverse" conditional, so this is
# a custom module; one per shell family because Windows has no `sh`.
[custom.nogit]
os = "linux"
when = "! git rev-parse --is-inside-work-tree"
format = "[](fg:blue)"
shell = ["sh"]

[custom.nogit_macos]
os = "macos"
when = "! git rev-parse --is-inside-work-tree"
format = "[](fg:blue)"
shell = ["sh"]

[custom.nogit_win]
os = "windows"
when = "if (git rev-parse --is-inside-work-tree 2>$null) { exit 1 } else { exit 0 }"
format = "[](fg:blue)"
shell = ["powershell", "-NoProfile", "-Command", "-"]

[git_branch]
symbol = " "
style = "fg:black bg:green"
format = "[](fg:blue bg:green)[ $symbol$branch ]($style)"

# Status stays inside the green block; the closing arrow is in the top-level
# format group above so it only appears inside a git repo.
[git_status]
style = "bold fg:red bg:green"
format = "([$all_status$ahead_behind ]($style))"

[cmd_duration]
min_time = 2000
format = " [took $duration]($style)"
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
