"$schema" = 'https://starship.rs/config-schema.json'

# Bullet-train look (https://github.com/caiogondim/bullet-train.zsh):
# solid colour blocks joined by powerline arrows. Needs a Nerd/Powerline font.
# os(+user@host) -> directory -> git, then cmd duration and the prompt char.
format = """
$os$username$hostname$directory\
${custom.nogit}${custom.nogit_macos}${custom.nogit_win}($git_branch$git_status[](fg:green))\
$cmd_duration
$character"""

add_newline = true

[os]
disabled = false
format = "[ $symbol]($style)"
style = "bold fg:white bg:black"

[os.symbols]
Windows = " "
Linux = " "
Macos = " "

[username]
show_always = false
style_user = "fg:white bg:black"
style_root = "bold fg:red bg:black"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold fg:yellow bg:black"
format = "[@$hostname ]($style)"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold fg:white bg:blue"
read_only_style = "fg:red bg:blue"
format = "[](fg:black bg:blue)[ $path ]($style)[$read_only]($read_only_style)"

# Closing arrow for the directory block when NOT in a git repo (inside a repo
# the git block supplies it). Starship has no "inverse" conditional, so this is
# a custom module; one per shell family because Windows has no `sh`.
[custom.nogit]
os = "linux"
when = "! git rev-parse --is-inside-work-tree"
format = "[](fg:blue)"
shell = ["sh"]

[custom.nogit_macos]
os = "macos"
when = "! git rev-parse --is-inside-work-tree"
format = "[](fg:blue)"
shell = ["sh"]

[custom.nogit_win]
os = "windows"
when = "if (git rev-parse --is-inside-work-tree 2>$null) { exit 1 } else { exit 0 }"
format = "[](fg:blue)"
shell = ["powershell", "-NoProfile", "-Command", "-"]

[git_branch]
symbol = " "
style = "fg:black bg:green"
format = "[](fg:blue bg:green)[ $symbol$branch ]($style)"

# Status stays inside the green block; the closing arrow is in the top-level
# format group above so it only appears inside a git repo.
[git_status]
style = "bold fg:red bg:green"
format = "([$all_status$ahead_behind ]($style))"

[cmd_duration]
min_time = 2000
format = " [took $duration]($style)"
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
